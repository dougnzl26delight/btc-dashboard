name: Refresh dashboard data

# FALLBACK refresher. Primary freshness now comes from the always-on local
# task Crypto_dashboard_push, which pushes the locally-recomputed caches every
# hour (see push_dashboard.py). This Action is the backstop for when that
# machine is OFF: it recomputes on GitHub's servers and commits the caches with
# ZERO dependence on the laptop. Every 6h (not hourly) since it's only a
# fallback — fewer redundant commits. GitHub free-tier may still skip some
# scheduled runs; that's acceptable for a backstop. Manual run available too.
# The btcdelight-refresh Worker also dispatches it hourly; the first step skips
# the build whenever the PC has pushed live-data in the last 45 min.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h (UTC), :17 past — fallback cadence only
  workflow_dispatch: {}       # adds a "Run workflow" button

permissions:
  contents: write             # allow committing the refreshed caches back

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Fallback means fallback. The Worker dispatches this job hourly, but
      # several free feeds fail from GitHub's runners (Farside ETF flows, FRED
      # net liquidity, whale txs) and are silently left out - so while the PC
      # was up, these builds overwrote main every hour with "$+0M" ETF flows and
      # missing panels (found 2026-10-04: 31 of 34 cache commits in 30h were
      # ours). The PC's publish_live_cache task force-pushes the live-data branch
      # every ~3 min; if it pushed recently the PC is up and its caches win.
      - name: Skip if the home PC is publishing
        id: pc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ts=$(gh api "repos/${{ github.repository }}/commits/live-data" --jq '.commit.committer.date' 2>/dev/null || true)
          if [ -n "$ts" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$ts" +%s) ))
          else
            age=999999
          fi
          echo "live-data last pushed: ${ts:-unknown} (${age}s ago)"
          if [ "$age" -lt 2700 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Home PC published ${age}s ago - fallback not needed, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.pc.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.pc.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run precompute (per-panel failures are tolerated)
        if: steps.pc.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUTF8: '1'
        run: python precompute_dashboard.py || true

      - name: Commit refreshed caches
        if: steps.pc.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .panel_cache .simpleton_daily_brief.json .simpleton_brief_state.json 2>/dev/null || git add -f .panel_cache
          if git diff --cached --quiet; then
            echo "No cache changes this run."
          else
            git commit -m "data: refresh dashboard caches [skip ci]"
            # Self-heal if main advanced since checkout (overlapping runs / local push).
            # A lost push race is NOT a failure: another refresher already published
            # fresh caches this cycle, so exit 0 instead of emailing a failed job.
            if git push; then exit 0; fi
            echo "push rejected; rebasing onto latest and retrying"
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "::notice::Lost the push race — fresh caches already published this cycle; not failing."
          fi
